<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TexOps - Gestión de Empleados</title>
    <!-- Bootstrap CSS para un diseño rapido y limpio -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .bg-musgo { background-color: #4A5D23 !important; color: white; }
        .btn-musgo { background-color: #4A5D23; color: white; border: none; }
        .btn-musgo:hover { background-color: #3A491C; color: white; }
        .text-musgo { color: #4A5D23; }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">

    <div class="d-flex align-items-center mb-4">
        <img src="/images/logo.png" alt="Logo" height="60" class="me-3" onerror="this.style.display='none'">
        <h2 class="text-musgo mb-0">Módulo de Empleados y Turnos</h2>
    </div>

    <!-- -R        barra de busqueda y filtros -->
    <div class="row mb-3">
        <div class="col-md-8">
            <input type="text" id="searchInput" class="form-control border-success" placeholder="Buscar empleado por código o nombre...">
        </div>
        <div class="col-md-4 d-flex align-items-center justify-content-end">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="hideInactiveSwitch" style="background-color: #4A5D23; border-color: #4A5D23;">
                <label class="form-check-label fw-bold text-musgo ms-2" for="hideInactiveSwitch">Ocultar Inactivos</label>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-musgo d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Lista de Empleados</h5>
            <a href="/empleados/formulario" class="btn btn-light btn-sm text-musgo fw-bold">Nuevo Empleado</a>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <!-- Iteramos sobre la lista de empleados inyectada desde el WebController -->
                <tr th:each="employee : ${employees}">
                    <td th:text="${employee.id}"></td>
                    <td th:text="${employee.code}"></td>
                    <td th:text="${employee.name}"></td>
                    <td>
                        <span th:if="${employee.active}" class="badge bg-success">Activo</span>
                        <span th:unless="${employee.active}" class="badge bg-secondary">Inactivo</span>
                    </td>
                    <td>
                        <!-- -R        enlace directo a la vista de gestion de turnos -->
                        <a th:href="@{/empleados/{id}/turnos(id=${employee.id})}" class="btn btn-info btn-sm text-white">Turnos</a>

                        <button class="btn btn-warning btn-sm text-white"
                                th:data-id="${employee.id}"
                                th:data-code="${employee.code}"
                                th:data-name="${employee.name}"
                                th:data-active="${employee.active}"
                                onclick="editEmployee(this.dataset.id, this.dataset.code, this.dataset.name, this.dataset.active)">
                            Editar
                        </button>

                        <button class="btn btn-secondary btn-sm" th:onclick="|toggleStatus(${employee.id})|">
                            <span th:text="${employee.active ? 'Desactivar' : 'Activar'}"></span>
                        </button>

                        <button class="btn btn-danger btn-sm" th:onclick="|deleteEmployee(${employee.id})|">
                            Eliminar
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- -R        script para manejar las peticiones a la api -->
<script>
    // -R        redirigir al formulario enviando los datos por la url
    function editEmployee(id, code, name, active) {
        window.location.href = `/empleados/formulario?id=${id}&code=${code}&name=${name}&active=${active}`;
    }

    // -R        eliminar empleado con alerta de confirmacion profesional
    function deleteEmployee(id) {
        Swal.fire({
            title: '¿Estás seguro?',
            text: "Se eliminará permanentemente al empleado.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Sí, eliminar',
            cancelButtonText: 'Cancelar'
        }).then(async (result) => {
            if (result.isConfirmed) {
                try {
                    const response = await fetch(`/api/employees/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        window.location.reload();
                    } else {
                        Swal.fire('Rechazado', await response.text(), 'error');
                    }
                } catch (error) {
                    Swal.fire('Error', 'Fallo de conexión.', 'error');
                }
            }
        });
    }

    // -R        cambiar estado con alerta silenciosa si falla
    async function toggleStatus(id) {
        try {
            const response = await fetch(`/api/employees/${id}/toggle-status`, { method: 'PATCH' });
            if (response.ok) {
                window.location.reload();
            } else {
                Swal.fire('Error', await response.text(), 'error');
            }
        } catch (error) {
            console.error('Error al cambiar estado:', error);
        }
    }

    // -R        logica de filtrado dinamico en la tabla
    function filterTable() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const hideInactive = document.getElementById('hideInactiveSwitch').checked;
        const rows = document.querySelectorAll('tbody tr');

        rows.forEach(row => {
            const code = row.querySelector('td:nth-child(2)').innerText.toLowerCase();
            const name = row.querySelector('td:nth-child(3)').innerText.toLowerCase();
            const statusText = row.querySelector('td:nth-child(4)').innerText.trim();

            const matchesSearch = code.includes(searchTerm) || name.includes(searchTerm);
            const matchesStatus = hideInactive ? statusText === 'Activo' : true;

            if (matchesSearch && matchesStatus) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
    }

    // -R        escuchadores de eventos para ejecutar el filtro al escribir o cambiar el switch
    document.getElementById('searchInput').addEventListener('input', filterTable);
    document.getElementById('hideInactiveSwitch').addEventListener('change', filterTable);

</script>


</body>
</html>-
