<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Turnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        .bg-musgo { background-color: #4A5D23 !important; color: white; }
        .btn-musgo { background-color: #4A5D23; color: white; border: none; }
        .btn-musgo:hover { background-color: #3A491C; color: white; }
        .text-musgo { color: #4A5D23; }
    </style>
</head>
<body class="bg-light">

<input type="hidden" id="employeeId" th:value="${employeeId}">
<input type="hidden" id="employeeName" th:value="${employeeName}">

<div class="container mt-5">
    <div class="d-flex align-items-center mb-4">
        <img src="/images/logo.png" id="logoImg" alt="Logo" height="60" class="me-3" onerror="this.style.display='none'">
        <h2 class="text-musgo mb-0">Turnos de <span th:text="${employeeName}"></span></h2>
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 border-top border-4 border-success mb-4">
                <div class="card-body">
                    <h5 class="card-title text-musgo mb-3" id="formTitle">Asignar Turno</h5>
                    <form id="shiftForm">
                        <input type="hidden" id="editingShiftId" value="">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre del Turno</label>
                            <input type="text" class="form-control" id="shiftName" placeholder="Ej. Nocturno" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Hora de Inicio</label>
                            <input type="time" class="form-control" id="startTime" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Hora de Fin</label>
                            <input type="time" class="form-control" id="endTime" required>
                        </div>
                        <button type="submit" class="btn btn-musgo w-100" id="submitBtn">Guardar Turno</button>
                        <button type="button" class="btn btn-outline-secondary w-100 mt-2 d-none" id="cancelEditBtn" onclick="resetForm()">Cancelar Edición</button>
                    </form>
                </div>
            </div>
            <a href="/" class="btn btn-outline-secondary w-100">Volver a Empleados</a>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm">
                <!-- -R        Encabezado corregido, sin anidacion doble -->
                <div class="card-header bg-musgo d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 text-white">Turnos Asignados</h5>
                    <div>
                        <button class="btn btn-sm btn-light text-success fw-bold me-1" onclick="exportExcel()">⬇ Excel</button>
                        <button class="btn btn-sm btn-light text-danger fw-bold" onclick="exportPDF()">⬇ PDF</button>
                    </div>
                </div>
                <div class="card-body">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Turno</th>
                            <th>Inicio</th>
                            <th>Fin</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody id="shiftsTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const employeeId = document.getElementById('employeeId').value;
    document.addEventListener('DOMContentLoaded', loadShifts);

    async function loadShifts() {
        try {
            const response = await fetch(`/api/workshifts/employee/${employeeId}`);
            if (response.ok) {
                const shifts = await response.json();
                const tbody = document.getElementById('shiftsTableBody');
                tbody.innerHTML = '';

                if (shifts.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No hay turnos asignados.</td></tr>';
                    return;
                }

                shifts.forEach(shift => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${shift.id}</td>
                            <td>${shift.shiftName}</td>
                            <td>${shift.startTime.substring(0, 5)}</td>
                            <td>${shift.endTime.substring(0, 5)}</td>
                            <td>
                                <button class="btn btn-warning btn-sm text-white" onclick="editShift(${shift.id}, '${shift.shiftName}', '${shift.startTime}', '${shift.endTime}')">Editar</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteShift(${shift.id})">Eliminar</button>
                            </td>
                        </tr>
                    `;
                });
            }
        } catch (error) {
            Swal.fire('Error', 'No se pudieron cargar los turnos.', 'error');
        }
    }

    function editShift(id, name, start, end) {
        document.getElementById('editingShiftId').value = id;
        document.getElementById('shiftName').value = name;
        document.getElementById('startTime').value = start.substring(0, 5);
        document.getElementById('endTime').value = end.substring(0, 5);
        document.getElementById('formTitle').innerText = 'Editar Turno';
        document.getElementById('submitBtn').innerText = 'Actualizar Turno';
        document.getElementById('cancelEditBtn').classList.remove('d-none');
    }

    function resetForm() {
        document.getElementById('shiftForm').reset();
        document.getElementById('editingShiftId').value = '';
        document.getElementById('formTitle').innerText = 'Asignar Turno';
        document.getElementById('submitBtn').innerText = 'Guardar Turno';
        document.getElementById('cancelEditBtn').classList.add('d-none');
    }

    document.getElementById('shiftForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const shiftNameInput = document.getElementById('shiftName').value;
        const shiftNameTrimmed = shiftNameInput.trim();

        if(shiftNameTrimmed === '') {
            Swal.fire({
                icon: 'warning',
                title: 'Atención',
                text: 'El nombre del turno no puede estar vacío o contener solo espacios.',
                confirmButtonColor: '#4A5D23'
            });
            return;
        }

        const editingId = document.getElementById('editingShiftId').value;
        const method = editingId ? 'PUT' : 'POST';
        const url = editingId ? `/api/workshifts/${editingId}` : '/api/workshifts';

        const data = {
            shiftName: shiftNameTrimmed,
            startTime: document.getElementById('startTime').value + ':00',
            endTime: document.getElementById('endTime').value + ':00',
            employee: { id: employeeId }
        };

        try {
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                Swal.fire({
                    icon: 'success',
                    title: editingId ? 'Turno actualizado' : 'Turno asignado',
                    showConfirmButton: false,
                    timer: 1500
                });
                resetForm();
                loadShifts();
            } else {
                const errorMessage = await response.text();
                Swal.fire({
                    icon: 'error',
                    title: 'Operación rechazada',
                    text: errorMessage,
                    confirmButtonColor: '#4A5D23'
                });
            }
        } catch (error) {
            Swal.fire('Error', 'Ocurrió un error en el servidor.', 'error');
        }
    });

    function deleteShift(shiftId) {
        Swal.fire({
            title: '¿Estás seguro?',
            text: "No podrás revertir esto.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Sí, eliminar',
            cancelButtonText: 'Cancelar'
        }).then(async (result) => {
            if (result.isConfirmed) {
                const response = await fetch(`/api/workshifts/${shiftId}`, { method: 'DELETE' });
                if (response.ok) {
                    Swal.fire({ icon: 'success', title: 'Eliminado', text: 'El turno ha sido eliminado.', showConfirmButton: false, timer: 1500 });
                    loadShifts();
                } else {
                    Swal.fire('Error', await response.text(), 'error');
                }
            }
        });
    }

    function getTableData() {
        const tbody = document.getElementById('shiftsTableBody');
        const rows = tbody.querySelectorAll('tr');
        const data = [];
        rows.forEach(row => {
            if (row.cells.length > 1) {
                data.push([
                    row.cells[0].innerText,
                    row.cells[1].innerText,
                    row.cells[2].innerText,
                    row.cells[3].innerText
                ]);
            }
        });
        return data;
    }

    function exportExcel() {
        const empName = document.getElementById('employeeName').value;
        const wb = XLSX.utils.book_new();
        const wsData = [
            ['Reporte de Turnos Asignados'],
            ['Empleado:', empName],
            [],
            ['ID', 'Turno', 'Hora Inicio', 'Hora Fin'],
            ...getTableData()
        ];
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        ws['!cols'] = [{wch: 5}, {wch: 25}, {wch: 15}, {wch: 15}];
        XLSX.utils.book_append_sheet(wb, ws, "Horario");
        XLSX.writeFile(wb, `Turnos_${empName.replace(/\s+/g, '_')}.xlsx`);
        Swal.fire({ icon: 'success', title: 'Excel descargado', showConfirmButton: false, timer: 1500 });
    }

    function getBase64Image(img) {
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth || img.width;
        canvas.height = img.naturalHeight || img.height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        return canvas.toDataURL("image/png");
    }

    function exportPDF() {
        const empName = document.getElementById('employeeName').value;
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        const logo = document.getElementById('logoImg');
        if (logo && logo.complete && logo.naturalWidth > 0) {
            const imgData = getBase64Image(logo);
            doc.addImage(imgData, 'PNG', 14, 10, 30, 30);
        }

        doc.setFontSize(16);
        doc.setTextColor(74, 93, 35);
        doc.text("Horario de Turnos", 50, 22);

        doc.setFontSize(12);
        doc.setTextColor(100, 100, 100);
        doc.text(`Empleado: ${empName}`, 50, 30);

        // -R        creamos el arreglo en una variable separada para evitar los corchetes dobles de thymeleaf
        const cabeceras = ['ID', 'Turno', 'Inicio', 'Fin'];

        doc.autoTable({
            head: [cabeceras],
            body: getTableData(),
            startY: 45,
            theme: 'grid',
            headStyles: { fillColor: [74, 93, 35] }
        });

        doc.save(`Turnos_${empName.replace(/\s+/g, '_')}.pdf`);
        Swal.fire({ icon: 'success', title: 'PDF descargado', showConfirmButton: false, timer: 1500 });
    }
</script>
</body>
</html>
